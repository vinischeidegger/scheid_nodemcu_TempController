[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
upload_speed = 115200
monitor_speed = 115200
board_build.filesystem = littlefs
build_flags =
    -D CORE_DEBUG_LEVEL=1
lib_deps =
    symlink://../scheid_nodemcu_ConfigManager
    milesburton/DallasTemperature @ ^3.11.0
    paulstoffregen/OneWire @ ^2.3.8
lib_extra_dirs = ..
extra_scripts = pre:../scheid_nodemcu_ConfigManager/scripts/config_manager_assets.py
